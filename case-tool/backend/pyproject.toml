[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "software1-case-backend"
version = "0.1.0"
description = "FastAPI backend for the Software 1 CASE tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.52,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/case_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
